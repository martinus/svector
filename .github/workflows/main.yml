name: Build, Test, Lint

# Build pushes to main and any pull request. Previously this was "[push, pull_request]",
# which ran everything twice for a branch that has a PR open: once for the push and once
# for the pull_request event.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run obsolete, so cancel it. Runs on main are never
# cancelled, they are the ones the badge points at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Downloaded wrap tarballs land here, so the cache key only has to track the wrap files.
  MESON_PACKAGE_CACHE: subprojects/packagecache

# see https://github.com/mesonbuild/meson/blob/master/docs/markdown/Continuous-Integration.md
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - run: ./scripts/lint/lint-all.py

  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: sudo apt-get install -yq libboost-dev
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: linux
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: actions/cache@v4
      with:
        path: ${{ env.MESON_PACKAGE_CACHE }}
        key: wraps-${{ hashFiles('subprojects/*.wrap') }}
    - run: pip install meson ninja
    - run: meson setup builddir/
      env:
        CXX: ccache c++
    - run: meson test -C builddir/ --print-errorlogs
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Linux_Meson_Testlog
        path: builddir/meson-logs/testlog.txt

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    # gcc used to be installed here but nothing uses it: the build runs with CXX=c++,
    # which is AppleClang. Brewing gcc was the single most expensive step in this job.
    - run: brew install boost
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos
    - uses: actions/cache@v4
      with:
        path: ${{ env.MESON_PACKAGE_CACHE }}
        key: wraps-${{ hashFiles('subprojects/*.wrap') }}
    - run: pip install meson ninja
    - run: meson setup builddir/
      env:
        CXX: ccache c++
    - run: meson test -C builddir/ --print-errorlogs
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: MacOS_Meson_Testlog
        path: builddir/meson-logs/testlog.txt

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    # This job had no compiler cache at all and was by far the slowest. ccache does not
    # support MSVC, sccache does.
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: sccache
        key: windows
    - uses: actions/cache@v4
      with:
        path: ${{ env.MESON_PACKAGE_CACHE }}
        key: wraps-${{ hashFiles('subprojects/*.wrap') }}
    - run: pip install meson ninja
    - uses: ilammy/msvc-dev-cmd@v1
    - run: meson setup builddir
      env:
        CXX: sccache cl
    - run: meson test -C builddir --print-errorlogs
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Windows_Meson_Testlog
        path: |
          builddir/meson-logs/testlog.txt
          builddir/test/test-svector.exe

  # Address + undefined behaviour sanitizers. clang is used rather than g++ because its
  # __has_feature is what the bad_alloc test uses to skip its deliberate huge allocation.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: sanitizers
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: actions/cache@v4
      with:
        path: ${{ env.MESON_PACKAGE_CACHE }}
        key: wraps-${{ hashFiles('subprojects/*.wrap') }}
    - run: pip install meson ninja
    - run: >
        meson setup builddir/
        --buildtype=debugoptimized
        -Db_sanitize=address,undefined
        -Db_lundef=false
      env:
        CXX: ccache clang++
    - run: meson test -C builddir/ --print-errorlogs
      env:
        ASAN_OPTIONS: detect_stack_use_after_return=1:strict_string_checks=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Sanitizers_Meson_Testlog
        path: builddir/meson-logs/testlog.txt

  # Builds with the hardening flags a distribution would use. _GLIBCXX_ASSERTIONS is the
  # interesting one for a container: it turns on libstdc++'s precondition checks.
  hardened:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: hardened
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: actions/cache@v4
      with:
        path: ${{ env.MESON_PACKAGE_CACHE }}
        key: wraps-${{ hashFiles('subprojects/*.wrap') }}
    - run: pip install meson ninja
    - run: >
        meson setup builddir/
        --buildtype=debugoptimized
        -Dcpp_args="-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -D_GLIBCXX_ASSERTIONS
        -fstack-protector-strong -fstack-clash-protection -fcf-protection=full
        -Wformat -Wformat-security -Werror=format-security"
        -Dcpp_link_args="-Wl,-z,relro -Wl,-z,now -Wl,-z,noexecstack"
      env:
        CXX: ccache c++
    - run: meson test -C builddir/ --print-errorlogs
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Hardened_Meson_Testlog
        path: builddir/meson-logs/testlog.txt
