name: Release

# A tag is the one thing here that is genuinely hard to take back: deleting a pushed tag does
# not delete it from the clones that already fetched it. So the checks that a release is what
# it claims to be belong at tag push, before anyone builds from it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  MESON_PACKAGE_CACHE: subprojects/packagecache

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # The ancestor check below needs main and the history connecting it to the tag.
        fetch-depth: 0

    # lint-version.py already checks meson.build, CMakeLists.txt and svector.h against each
    # other, on every run. What nothing checked before is whether the tag agrees with them:
    # v1.2.1 was once pushed onto the wrong commit and had to be deleted from the remote
    # again. The release convention is to tag the "Bump version to X.Y.Z" commit, which by
    # then is often no longer the tip of main, so this is easy to get wrong by hand.
    - name: Tag matches the version in the tagged commit
      run: ./scripts/lint/lint-version.py --expect "${GITHUB_REF_NAME#v}"

    - name: Tagged commit is on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
          echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: pip
        cache-dependency-path: .github/workflows/requirements.txt
    - uses: actions/cache@v4
      with:
        path: ${{ env.MESON_PACKAGE_CACHE }}
        key: wraps-${{ hashFiles('subprojects/*.wrap') }}
    - run: pip install -r .github/workflows/requirements.txt

    # main.yml has already built this commit in every configuration, since the tag is on main.
    # This is here so a release cannot be cut from a commit that was never actually run.
    - run: meson setup builddir --force-fallback-for=fmt
    - run: meson test -C builddir --print-errorlogs
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: release-meson-testlog
        path: builddir/meson-logs/testlog.txt
